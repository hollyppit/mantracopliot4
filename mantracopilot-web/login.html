<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>로그인 — 만트라 코파일럿</title>
<link rel="stylesheet" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
<style>
:root {
  --bg: #030305;
  --purple: #10B981;
  --purple-light: #6EE7B7;
  --gold: #D6B75A;
  --gold-light: #FDE68A;
  --text: #F8FAFC;
  --text-dim: #94A3B8;
  --text-faint: #475569;
  --border: rgba(255,255,255,0.08);
  --red: #F87171;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: 'Pretendard', -apple-system, sans-serif;
  background: var(--bg); color: var(--text);
  min-height: 100vh; display: flex;
  align-items: center; justify-content: center;
  letter-spacing: -0.01em;
}

/* 배경 글로우 */
.bg {
  position: fixed; inset: 0; pointer-events: none;
  background:
    radial-gradient(ellipse at 25% 45%, rgba(16,185,129,0.20) 0%, transparent 60%),
    radial-gradient(ellipse at 75% 20%, rgba(214,183,90,0.10) 0%, transparent 50%),
    radial-gradient(ellipse at 55% 85%, rgba(16,185,129,0.09) 0%, transparent 45%);
}

/* 카드 */
.card {
  position: relative; z-index: 1;
  width: 100%; max-width: 440px;
  margin: 20px;
  background: rgba(8,8,15,0.92);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 36px; padding: 44px 40px;
  backdrop-filter: blur(80px) saturate(180%);
  box-shadow: 0 48px 120px rgba(0,0,0,0.85),
    inset 0 1px 0 rgba(255,255,255,0.10),
    inset 0 -1px 0 rgba(255,255,255,0.03),
    0 0 0 1px rgba(16,185,129,0.05);
}

/* 로고 */
.logo {
  display: flex; align-items: center; justify-content: center;
  gap: 10px; margin-bottom: 36px;
  text-decoration: none;
}
.logo-img { width: 34px; height: 34px; }
.logo-text { font-size: 22px; font-weight: 900; color: var(--text); letter-spacing: -0.03em; }
.logo-text span { color: var(--purple-light); font-weight: 600; }

/* 탭 */
.tabs {
  display: flex;
  border-bottom: 1px solid rgba(255,255,255,0.07);
  margin-bottom: 28px;
  gap: 0;
  background: transparent;
  padding: 0;
  border-radius: 0;
  border-left: none; border-top: none; border-right: none;
}
.tab-btn {
  flex: 1; padding: 11px 8px 13px;
  border-radius: 0;
  font-size: 14px; font-weight: 700; font-family: inherit;
  border: none; cursor: pointer; color: var(--text-faint);
  background: transparent; transition: all .25s;
  border-bottom: 2px solid transparent;
  margin-bottom: -1px;
  letter-spacing: -0.01em;
}
.tab-btn.active {
  background: transparent;
  color: var(--purple-light);
  border-bottom: 2px solid var(--purple-light);
  box-shadow: none;
}
.tab-btn:not(.active):hover { color: var(--text-dim); }

/* 폼 */
.form { display: flex; flex-direction: column; gap: 14px; }
.form-group { display: flex; flex-direction: column; gap: 7px; }
.form-label { font-size: 11px; font-weight: 700; color: var(--text-faint); letter-spacing: 0.06em; text-transform: uppercase; }
.form-input {
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 16px; padding: 14px 18px;
  font-size: 15px; color: var(--text); font-family: inherit;
  outline: none; transition: all .25s;
}
.form-input:focus { border-color: rgba(16,185,129,0.5); background: rgba(16,185,129,0.05); box-shadow: 0 0 0 4px rgba(16,185,129,0.08); }
.form-input::placeholder { color: var(--text-faint); font-size: 14px; }

/* 버튼 */
.btn-primary {
  width: 100%; padding: 16px;
  background: linear-gradient(135deg, #10B981, #059669);
  border: none; color: #fff; border-radius: 100px;
  font-size: 15px; font-weight: 800; font-family: inherit;
  cursor: pointer; margin-top: 6px;
  box-shadow: 0 4px 24px rgba(16,185,129,0.45), inset 0 1px 0 rgba(255,255,255,0.15);
  transition: all .25s cubic-bezier(0.16,1,0.3,1); letter-spacing: -0.01em;
  display: flex; align-items: center; justify-content: center; gap: 8px;
}
.btn-primary:hover { transform: translateY(-2px); box-shadow: 0 10px 36px rgba(16,185,129,0.55), inset 0 1px 0 rgba(255,255,255,0.15); }
.btn-primary:active { transform: translateY(0); }
.btn-primary:disabled { opacity: 0.55; cursor: not-allowed; transform: none; }

/* 구분선 */
.divider {
  display: flex; align-items: center; gap: 14px;
  margin: 6px 0; color: var(--text-faint); font-size: 11px; font-weight: 700;
  letter-spacing: 0.06em; text-transform: uppercase;
}
.divider::before, .divider::after {
  content: ''; flex: 1; height: 1px; background: rgba(255,255,255,0.06);
}

/* 소셜 버튼 */
.btn-social {
  width: 100%; padding: 14px;
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.08); border-radius: 100px;
  color: var(--text); font-size: 14px; font-weight: 700;
  font-family: inherit; cursor: pointer;
  display: flex; align-items: center; justify-content: center; gap: 10px;
  transition: all .25s;
}
.btn-social:hover { background: rgba(255,255,255,0.08); border-color: rgba(255,255,255,0.14); transform: translateY(-1px); }
.btn-kakao {
  background: #FEE500; border-color: #FEE500; color: #191919;
  box-shadow: 0 4px 16px rgba(254,229,0,0.25);
}
.btn-kakao:hover { background: #FFD700; border-color: #FFD700; box-shadow: 0 6px 20px rgba(254,229,0,0.35); }
.kakao-icon { width: 20px; height: 20px; }

/* 에러/성공 메시지 */
.msg {
  padding: 13px 16px; border-radius: 14px;
  font-size: 13px; font-weight: 600; line-height: 1.5;
  margin-bottom: 4px;
  display: none;
}
.msg.error { background: rgba(248,113,113,0.1); border: 1px solid rgba(248,113,113,0.2); color: var(--red); display: block; }
.msg.success { background: rgba(74,222,128,0.1); border: 1px solid rgba(74,222,128,0.2); color: #4ADE80; display: block; }

/* 로딩 스피너 */
.spinner {
  width: 18px; height: 18px;
  border: 2px solid rgba(255,255,255,0.3);
  border-top-color: #fff; border-radius: 50%;
  animation: spin 0.7s linear infinite;
  display: none;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* 하단 링크 */
.footer-link {
  text-align: center; margin-top: 22px;
  font-size: 13px; color: var(--text-faint);
}
.footer-link a {
  color: var(--purple-light); text-decoration: none; font-weight: 700;
}
.footer-link a:hover { text-decoration: underline; }

/* 이용약관 */
.terms {
  font-size: 12px; color: var(--text-faint); text-align: center;
  margin-top: 20px; line-height: 1.8;
}
.terms a { color: var(--text-faint); text-decoration: underline; text-underline-offset: 2px; }
.terms a:hover { color: var(--text-dim); }

/* ── MOBILE ── */
@media (max-width: 480px) {
  body { -webkit-tap-highlight-color: transparent; }
  .card { padding: 28px 20px; border-radius: 24px; margin: 12px; }
  .logo { margin-bottom: 24px; gap: 8px; }
  .logo-img { width: 28px; height: 28px; }
  .logo-text { font-size: 19px; }
  .tabs { margin-bottom: 20px; }
  .tab-btn { padding: 14px 8px 14px; font-size: 14px; }
  .form { gap: 12px; }
  .form-label { font-size: 12px; }
  .form-input { padding: 14px 16px; font-size: 16px; border-radius: 14px; }
  .form-input::placeholder { font-size: 14px; }
  .btn-primary { padding: 16px; font-size: 15px; }
  .btn-social { padding: 14px; font-size: 14px; }
  .divider { margin: 4px 0; }
  .footer-link { margin-top: 16px; }
  .terms { margin-top: 14px; }
}
@media (max-width: 360px) {
  .card { padding: 24px 16px; margin: 8px; }
  .logo-text { font-size: 17px; }
}
</style>
</head>
<body>
<div class="bg"></div>

<div class="card">
  <!-- 로고 -->
  <a class="logo" href="index.html">
    <img class="logo-img" src="images/로고만(흰).png" alt="logo" onerror="this.style.display='none'">
    <div class="logo-text">Mantra <span>Copilot</span></div>
  </a>

  <!-- 탭 -->
  <div class="tabs">
    <button class="tab-btn active" id="tabLogin" onclick="switchTab('login')">로그인</button>
    <button class="tab-btn" id="tabSignup" onclick="switchTab('signup')">회원가입</button>
  </div>

  <!-- 메시지 -->
  <div class="msg" id="msg"></div>

  <!-- 로그인 폼 -->
  <div id="formLogin">
    <div class="form">
      <div class="form-group">
        <label class="form-label">이메일</label>
        <input class="form-input" type="email" id="loginEmail" placeholder="example@email.com" autocomplete="email">
      </div>
      <div class="form-group">
        <label class="form-label">비밀번호</label>
        <input class="form-input" type="password" id="loginPassword" placeholder="비밀번호 입력" autocomplete="current-password">
      </div>
      <button class="btn-primary" id="btnLogin" onclick="handleLogin()">
        <span class="spinner" id="loginSpinner"></span>
        <span id="loginBtnText">로그인</span>
      </button>
    </div>

    <div class="divider" style="margin-top:20px;">또는</div>

    <button class="btn-social btn-kakao" onclick="handleKakaoLogin()">
      <svg class="kakao-icon" viewBox="0 0 24 24" fill="#191919">
        <path d="M12 3C6.48 3 2 6.48 2 10.8c0 2.74 1.56 5.15 3.93 6.63-.15.56-.97 3.63-.97 3.63s-.04.17.09.24c.13.07.27 0 .27 0l4.5-2.98c.69.1 1.4.15 2.18.15 5.52 0 10-3.48 10-7.8S17.52 3 12 3z"/>
      </svg>
      카카오로 로그인
    </button>
  </div>

  <!-- 회원가입 폼 -->
  <div id="formSignup" style="display:none;">
    <div class="form">
      <div class="form-group">
        <label class="form-label">닉네임 (필명)</label>
        <input class="form-input" type="text" id="signupNickname" placeholder="예: 릴매, 작가님" autocomplete="nickname">
      </div>
      <div class="form-group">
        <label class="form-label">이메일</label>
        <input class="form-input" type="email" id="signupEmail" placeholder="example@email.com" autocomplete="email">
      </div>
      <div class="form-group">
        <label class="form-label">비밀번호</label>
        <input class="form-input" type="password" id="signupPassword" placeholder="8자 이상" autocomplete="new-password">
      </div>
      <button class="btn-primary" id="btnSignup" onclick="handleSignup()">
        <span class="spinner" id="signupSpinner"></span>
        <span id="signupBtnText">무료로 시작하기</span>
      </button>
    </div>

    <div class="divider" style="margin-top:20px;">또는</div>

    <button class="btn-social btn-kakao" onclick="handleKakaoLogin()">
      <svg class="kakao-icon" viewBox="0 0 24 24" fill="#191919">
        <path d="M12 3C6.48 3 2 6.48 2 10.8c0 2.74 1.56 5.15 3.93 6.63-.15.56-.97 3.63-.97 3.63s-.04.17.09.24c.13.07.27 0 .27 0l4.5-2.98c.69.1 1.4.15 2.18.15 5.52 0 10-3.48 10-7.8S17.52 3 12 3z"/>
      </svg>
      카카오로 시작하기
    </button>

    <div class="terms">
      가입 시 <a href="#">이용약관</a> 및 <a href="#">개인정보처리방침</a>에 동의합니다.
    </div>
  </div>
</div>

_supabase.auth.onAuthStateChange((event, session) => {
  if (event === 'SIGNED_IN' && session) {
    const redirect = sessionStorage.getItem('mantra_redirect') || 'index.html';
    sessionStorage.removeItem('mantra_redirect');
    window.location.href = redirect;
  }
});

// ── 탭 전환 ──
function switchTab(tab) {
  const isLogin = tab === 'login';
  document.getElementById('tabLogin').classList.toggle('active', isLogin);
  document.getElementById('tabSignup').classList.toggle('active', !isLogin);
  document.getElementById('formLogin').style.display = isLogin ? 'block' : 'none';
  document.getElementById('formSignup').style.display = isLogin ? 'none' : 'block';
  clearMsg();
}

function showMsg(text, type = 'error') {
  const el = document.getElementById('msg');
  el.textContent = text;
  el.className = `msg ${type}`;
}
function clearMsg() {
  document.getElementById('msg').className = 'msg';
}

function setLoading(prefix, loading) {
  const btn = document.getElementById(`btn${prefix}`);
  const spinner = document.getElementById(`${prefix.toLowerCase()}Spinner`);
  const text = document.getElementById(`${prefix.toLowerCase()}BtnText`);
  btn.disabled = loading;
  spinner.style.display = loading ? 'block' : 'none';
  text.style.opacity = loading ? '0.5' : '1';
}

function handleLogin() { window.location.href = 'index.html'; }
function handleSignup() { window.location.href = 'index.html'; }
function handleKakaoLogin() { window.location.href = 'index.html'; }

// ── 엔터키 처리 ──
document.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    const loginVisible = document.getElementById('formLogin').style.display !== 'none';
    if (loginVisible) handleLogin(); else handleSignup();
  }

</body>
</html>
