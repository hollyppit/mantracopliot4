<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>관리자 — 만트라 코파일럿</title>
<link rel="stylesheet" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
:root {
  --bg: #030305;
  --surface: rgba(255,255,255,0.03);
  --surface2: rgba(255,255,255,0.06);
  --purple: #10B981;
  --purple-light: #6EE7B7;
  --purple-glow: rgba(16,185,129,0.25);
  --text: #F8FAFC;
  --text-dim: #94A3B8;
  --text-faint: #475569;
  --border: rgba(255,255,255,0.08);
  --red: #F87171;
  --green: #00C8E0;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Pretendard',-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;letter-spacing:-0.01em}

/* 로그인 화면 */
.login-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh;flex-direction:column;gap:16px}
.login-box{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:40px 36px;width:360px;text-align:center}
.login-title{font-size:20px;font-weight:900;margin-bottom:6px}
.login-sub{font-size:13px;color:var(--text-dim);margin-bottom:24px}
.login-input{width:100%;padding:12px 16px;background:var(--surface2);border:1px solid var(--border);border-radius:12px;color:var(--text);font-size:14px;font-family:inherit;outline:none;margin-bottom:14px;transition:border-color 0.2s}
.login-input:focus{border-color:rgba(16,185,129,0.5)}
.login-btn{width:100%;padding:12px;background:var(--purple);border:none;border-radius:12px;color:#fff;font-size:14px;font-weight:700;font-family:inherit;cursor:pointer;transition:filter 0.2s}
.login-btn:hover{filter:brightness(1.15)}
.login-err{font-size:12px;color:var(--red);margin-top:10px;display:none}

/* 관리 화면 */
.admin-wrap{display:none;max-width:800px;margin:0 auto;padding:32px 24px 80px}
.admin-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:32px}
.admin-title{font-size:22px;font-weight:900}
.admin-logout{padding:8px 16px;background:var(--surface2);border:1px solid var(--border);border-radius:10px;color:var(--text-dim);font-size:12px;font-weight:700;font-family:inherit;cursor:pointer;transition:all 0.2s}
.admin-logout:hover{background:rgba(248,113,113,0.1);border-color:var(--red);color:var(--red)}

/* 탭 */
.tab-bar{display:flex;gap:4px;margin-bottom:24px;border-bottom:1px solid var(--border);padding-bottom:0}
.tab{padding:10px 20px;font-size:13px;font-weight:700;color:var(--text-faint);cursor:pointer;border-bottom:2px solid transparent;transition:all 0.2s;background:none;border-top:none;border-left:none;border-right:none;font-family:inherit}
.tab:hover{color:var(--text-dim)}
.tab.on{color:var(--purple-light);border-bottom-color:var(--purple)}
.tab-panel{display:none}
.tab-panel.on{display:block}

/* 업로드 폼 */
.upload-section{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px;margin-bottom:20px}
.section-title{font-size:15px;font-weight:800;margin-bottom:16px;display:flex;align-items:center;gap:8px}
.mode-toggle{display:flex;gap:6px;margin-bottom:18px}
.mode-btn{padding:8px 18px;background:var(--surface2);border:1px solid var(--border);border-radius:10px;color:var(--text-dim);font-size:12px;font-weight:700;font-family:inherit;cursor:pointer;transition:all 0.2s}
.mode-btn.on{background:rgba(16,185,129,0.15);border-color:var(--purple);color:var(--purple-light)}
.upload-textarea{width:100%;min-height:180px;padding:14px 16px;background:var(--surface2);border:1px solid var(--border);border-radius:12px;color:var(--text);font-size:13px;font-family:inherit;outline:none;resize:vertical;line-height:1.7;transition:border-color 0.2s}
.upload-textarea:focus{border-color:rgba(16,185,129,0.5)}
.file-drop{border:2px dashed var(--border);border-radius:12px;padding:40px 20px;text-align:center;cursor:pointer;transition:all 0.2s;background:var(--surface2)}
.file-drop:hover,.file-drop.drag{border-color:var(--purple);background:rgba(16,185,129,0.05)}
.file-drop-icon{font-size:32px;margin-bottom:8px}
.file-drop-text{font-size:13px;color:var(--text-dim)}
.file-drop-hint{font-size:11px;color:var(--text-faint);margin-top:6px}
.file-name{margin-top:10px;font-size:12px;color:var(--purple-light);font-weight:700;display:none}
.submit-row{display:flex;justify-content:flex-end;margin-top:18px}
.submit-btn{padding:10px 28px;background:var(--purple);border:none;border-radius:12px;color:#fff;font-size:14px;font-weight:700;font-family:inherit;cursor:pointer;transition:all 0.2s;box-shadow:0 4px 14px var(--purple-glow)}
.submit-btn:hover{filter:brightness(1.15)}
.submit-btn:disabled{opacity:0.5;cursor:not-allowed;filter:none}
.status-msg{margin-top:14px;font-size:13px;padding:12px 16px;border-radius:10px;display:none;line-height:1.6}
.status-msg.ok{display:block;background:rgba(16,185,129,0.08);border:1px solid rgba(16,185,129,0.2);color:var(--purple-light)}
.status-msg.err{display:block;background:rgba(248,113,113,0.08);border:1px solid rgba(248,113,113,0.2);color:var(--red)}
.status-msg.loading{display:block;background:rgba(0,200,224,0.08);border:1px solid rgba(0,200,224,0.2);color:var(--green)}

/* 자료 목록 */
.ref-list{display:flex;flex-direction:column;gap:12px}
.ref-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:18px 20px;transition:border-color 0.2s}
.ref-card:hover{border-color:rgba(16,185,129,0.3)}
.ref-head{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.ref-title{font-size:14px;font-weight:800;flex:1}
.ref-cat{font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;background:rgba(16,185,129,0.1);color:var(--purple-light);white-space:nowrap}
.ref-content{font-size:13px;color:var(--text-dim);line-height:1.7;margin-bottom:8px}
.ref-keywords{display:flex;flex-wrap:wrap;gap:5px}
.ref-kw{font-size:11px;padding:2px 8px;border-radius:6px;background:var(--surface2);color:var(--text-faint);border:1px solid var(--border)}
.ref-meta{font-size:11px;color:var(--text-faint);margin-top:8px}
.ref-actions{display:flex;gap:6px;margin-top:10px;justify-content:flex-end}
.ref-act{padding:5px 12px;border-radius:8px;font-size:11px;font-weight:700;font-family:inherit;cursor:pointer;transition:all 0.15s;border:1px solid var(--border);background:var(--surface2);color:var(--text-dim)}
.ref-act:hover{border-color:var(--purple);color:var(--purple-light)}
.ref-act.del{color:var(--text-faint)}
.ref-act.del:hover{border-color:var(--red);color:var(--red);background:rgba(248,113,113,0.08)}
.ref-empty{text-align:center;padding:60px 20px;color:var(--text-faint);font-size:14px}
.ref-loading{text-align:center;padding:40px;color:var(--text-dim);font-size:13px}
/* 편집 모달 */
.edit-ov{position:fixed;inset:0;z-index:10000;background:rgba(0,0,0,0.7);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;padding:20px}
.edit-ov.on{display:flex}
.edit-box{background:#0D0F14;border:1px solid var(--border);border-radius:16px;width:100%;max-width:600px;max-height:85vh;overflow-y:auto;padding:24px}
.edit-box h3{font-size:16px;font-weight:800;margin-bottom:16px}
.edit-field{margin-bottom:14px}
.edit-field label{display:block;font-size:11px;font-weight:700;color:var(--text-faint);margin-bottom:5px;letter-spacing:0.04em}
.edit-field input,.edit-field textarea{width:100%;padding:10px 12px;background:var(--surface2);border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:13px;font-family:inherit;outline:none;transition:border-color 0.2s;box-sizing:border-box}
.edit-field input:focus,.edit-field textarea:focus{border-color:rgba(16,185,129,0.5)}
.edit-field textarea{min-height:200px;resize:vertical;line-height:1.7}
.edit-btns{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
.edit-btns button{padding:8px 20px;border-radius:10px;font-size:13px;font-weight:700;font-family:inherit;cursor:pointer;transition:all 0.15s}
.edit-save{background:var(--purple);border:none;color:#fff}
.edit-save:hover{filter:brightness(1.15)}
.edit-cancel{background:var(--surface2);border:1px solid var(--border);color:var(--text-dim)}
.edit-cancel:hover{border-color:var(--text-faint);color:var(--text)}
/* 출처 입력 필드 */
.source-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px;margin-bottom:4px}
.source-input{width:100%;padding:10px 12px;background:var(--surface2);border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:13px;font-family:inherit;outline:none;transition:border-color 0.2s}
.source-input:focus{border-color:rgba(16,185,129,0.5)}
</style>
</head>
<body>

<!-- 로그인 -->
<div class="login-wrap" id="login-wrap">
  <div class="login-box">
    <div class="login-title">관리자 인증</div>
    <div class="login-sub">만트라 코파일럿 고증 자료 관리</div>
    <input type="password" class="login-input" id="admin-pw" placeholder="관리자 비밀번호" onkeydown="if(event.key==='Enter')doLogin()">
    <button class="login-btn" onclick="doLogin()">인증</button>
    <div class="login-err" id="login-err">비밀번호가 올바르지 않습니다.</div>
  </div>
</div>

<!-- 관리 화면 -->
<div class="admin-wrap" id="admin-wrap">
  <div class="admin-header">
    <div class="admin-title">전문가 고증 자료 관리</div>
    <button class="admin-logout" onclick="doLogout()">로그아웃</button>
  </div>

  <div class="tab-bar">
    <button class="tab on" onclick="switchTab('upload')">📤 자료 업로드</button>
    <button class="tab" onclick="switchTab('list')">📋 저장된 자료</button>
  </div>

  <!-- 업로드 탭 -->
  <div class="tab-panel on" id="panel-upload">
    <div class="upload-section">
      <div class="section-title">입력 방식 선택</div>
      <div class="mode-toggle">
        <button class="mode-btn on" id="mode-text" onclick="setMode('text')">텍스트 직접 입력</button>
        <button class="mode-btn" id="mode-file" onclick="setMode('file')">파일 업로드</button>
      </div>

      <!-- 텍스트 입력 모드 -->
      <div id="input-text">
        <textarea class="upload-textarea" id="text-input" placeholder="전문가 고증 자료 텍스트를 붙여넣으세요..."></textarea>
      </div>

      <!-- 파일 업로드 모드 -->
      <div id="input-file" style="display:none">
        <div class="file-drop" id="file-drop" onclick="document.getElementById('file-real').click()">
          <div class="file-drop-icon">📁</div>
          <div class="file-drop-text">파일을 드래그하거나 클릭하여 선택</div>
          <div class="file-drop-hint">.txt, .md, .pdf 지원</div>
        </div>
        <input type="file" id="file-real" accept=".txt,.md,.pdf" style="display:none">
        <div class="file-name" id="file-name"></div>
      </div>

      <div class="source-row">
        <input class="source-input" id="source-book" placeholder="책 이름 (선택)">
        <input class="source-input" id="source-author" placeholder="저자 (선택)">
      </div>
      <div class="submit-row">
        <button class="submit-btn" id="submit-btn" onclick="doUpload()">업로드 & AI 분석</button>
      </div>
      <div class="status-msg" id="status-msg"></div>
    </div>
  </div>

  <!-- 자료 목록 탭 -->
  <div class="tab-panel" id="panel-list">
    <div id="ref-container">
      <div class="ref-loading">불러오는 중...</div>
    </div>
  </div>
</div>

<!-- 편집 모달 -->
<div class="edit-ov" id="edit-ov" onclick="if(event.target===this)closeEdit()">
  <div class="edit-box">
    <h3 id="edit-title">자료 편집</h3>
    <input type="hidden" id="edit-id">
    <div class="edit-field"><label>제목</label><input id="edit-f-title"></div>
    <div class="edit-field"><label>카테고리</label><input id="edit-f-category"></div>
    <div class="edit-field"><label>출처</label><input id="edit-f-source" placeholder="책이름 — 저자"></div>
    <div class="edit-field"><label>키워드 (쉼표 구분)</label><input id="edit-f-keywords"></div>
    <div class="edit-field"><label>본문</label><textarea id="edit-f-content"></textarea></div>
    <div class="edit-btns">
      <button class="edit-cancel" onclick="closeEdit()">취소</button>
      <button class="edit-save" onclick="saveEdit()">저장</button>
    </div>
  </div>
</div>

<script>
let adminPassword = '';
let uploadMode = 'text';
let selectedFile = null;

// 로그인
async function doLogin() {
  const pw = document.getElementById('admin-pw').value.trim();
  if (!pw) return;
  try {
    const res = await fetch('/api/references', { headers: { 'x-admin-password': pw } });
    if (res.ok) {
      adminPassword = pw;
      document.getElementById('login-wrap').style.display = 'none';
      document.getElementById('admin-wrap').style.display = 'block';
      loadReferences();
    } else {
      const el = document.getElementById('login-err');
      el.style.display = 'block';
      setTimeout(() => el.style.display = 'none', 3000);
    }
  } catch {
    const el = document.getElementById('login-err');
    el.textContent = '서버 연결 실패';
    el.style.display = 'block';
  }
}

function doLogout() {
  adminPassword = '';
  document.getElementById('admin-wrap').style.display = 'none';
  document.getElementById('login-wrap').style.display = 'flex';
  document.getElementById('admin-pw').value = '';
}

// 탭
function switchTab(name) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('on'));
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('on'));
  event.target.classList.add('on');
  document.getElementById('panel-' + name).classList.add('on');
  if (name === 'list') loadReferences();
}

// 입력 모드
function setMode(mode) {
  uploadMode = mode;
  document.getElementById('mode-text').classList.toggle('on', mode === 'text');
  document.getElementById('mode-file').classList.toggle('on', mode === 'file');
  document.getElementById('input-text').style.display = mode === 'text' ? '' : 'none';
  document.getElementById('input-file').style.display = mode === 'file' ? '' : 'none';
}

// 파일 드래그&드롭
const drop = document.getElementById('file-drop');
drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('drag'); });
drop.addEventListener('dragleave', () => drop.classList.remove('drag'));
drop.addEventListener('drop', e => {
  e.preventDefault(); drop.classList.remove('drag');
  if (e.dataTransfer.files[0]) pickFile(e.dataTransfer.files[0]);
});
document.getElementById('file-real').addEventListener('change', function() {
  if (this.files[0]) pickFile(this.files[0]);
});

function pickFile(f) {
  const ext = f.name.split('.').pop().toLowerCase();
  if (!['txt', 'md', 'pdf'].includes(ext)) {
    showStatus('err', '.txt, .md, .pdf 파일만 지원합니다.');
    return;
  }
  selectedFile = f;
  const fn = document.getElementById('file-name');
  fn.textContent = f.name + ' (' + (f.size / 1024).toFixed(1) + ' KB)';
  fn.style.display = 'block';
}

// PDF 텍스트 추출
async function extractPdfText(file) {
  const buf = await file.arrayBuffer();
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
  let text = '';
  for (let i = 1; i <= pdf.numPages; i++) {
    const page = await pdf.getPage(i);
    const tc = await page.getTextContent();
    text += tc.items.map(it => it.str).join(' ') + '\n';
  }
  return text;
}

// 업로드
async function doUpload() {
  const btn = document.getElementById('submit-btn');
  let content = '';
  let filename = '직접입력';

  if (uploadMode === 'text') {
    content = document.getElementById('text-input').value.trim();
    if (!content) { showStatus('err', '텍스트를 입력하세요.'); return; }
  } else {
    if (!selectedFile) { showStatus('err', '파일을 선택하세요.'); return; }
    filename = selectedFile.name;
    const ext = filename.split('.').pop().toLowerCase();
    try {
      if (ext === 'pdf') {
        showStatus('loading', 'PDF 텍스트 추출 중...');
        content = await extractPdfText(selectedFile);
      } else {
        content = await selectedFile.text();
      }
    } catch (e) {
      showStatus('err', '파일 읽기 실패: ' + e.message);
      return;
    }
    if (!content.trim()) { showStatus('err', '파일 내용이 비어있습니다.'); return; }
  }

  // 출처 조합
  const srcBook = document.getElementById('source-book').value.trim();
  const srcAuthor = document.getElementById('source-author').value.trim();
  if (srcBook || srcAuthor) {
    filename = [srcBook, srcAuthor].filter(Boolean).join(' — ');
  }

  btn.disabled = true;
  showStatus('loading', '⏳ AI 분석 중… 잠시만 기다려주세요.');

  try {
    const fd = new FormData();
    fd.append('text', content);
    fd.append('filename', filename);

    const res = await fetch('/api/upload', {
      method: 'POST',
      headers: { 'x-admin-password': adminPassword },
      body: fd
    });
    const json = await res.json();
    if (!res.ok) { showStatus('err', json.error || '업로드 실패'); btn.disabled = false; return; }

    const d = json.data?.[0] || json.data || {};
    showStatus('ok',
      '✅ 저장 완료!\n' +
      '제목: ' + (d.title || '') + '\n' +
      '카테고리: ' + (d.category || '') + '\n' +
      '출처: ' + (d.source_filename || '') + '\n' +
      '키워드: ' + (d.keywords || []).join(', ')
    );

    // 초기화
    document.getElementById('text-input').value = '';
    document.getElementById('source-book').value = '';
    document.getElementById('source-author').value = '';
    selectedFile = null;
    document.getElementById('file-name').style.display = 'none';
    document.getElementById('file-real').value = '';
  } catch (e) {
    showStatus('err', '네트워크 오류: ' + e.message);
  }
  btn.disabled = false;
}

function showStatus(type, msg) {
  const el = document.getElementById('status-msg');
  el.className = 'status-msg ' + type;
  el.textContent = msg;
  el.style.whiteSpace = 'pre-wrap';
}

// 자료 목록 조회
async function loadReferences() {
  const container = document.getElementById('ref-container');
  container.innerHTML = '<div class="ref-loading">불러오는 중...</div>';

  try {
    const res = await fetch('/api/references', { headers: { 'x-admin-password': adminPassword } });
    if (!res.ok) { container.innerHTML = '<div class="ref-empty">조회 실패</div>'; return; }
    const json = await res.json();
    const list = json.data || [];

    if (!list.length) {
      container.innerHTML = '<div class="ref-empty">저장된 고증 자료가 없습니다.</div>';
      return;
    }

    container.innerHTML = '<div class="ref-list">' + list.map(r => `
      <div class="ref-card" data-id="${esc(r.id)}">
        <div class="ref-head">
          <div class="ref-title">${esc(r.title)}</div>
          <span class="ref-cat">${esc(r.category)}</span>
        </div>
        <div class="ref-content">${esc((r.content||'').substring(0,300))}${(r.content||'').length>300?'…':''}</div>
        <div class="ref-keywords">${(r.keywords||[]).map(k=>'<span class="ref-kw">'+esc(k)+'</span>').join('')}</div>
        ${r.source_filename ? '<div class="ref-meta">출처: '+esc(r.source_filename)+'</div>' : ''}
        <div class="ref-actions">
          <button class="ref-act" onclick="openEdit('${r.id}')">수정</button>
          <button class="ref-act del" onclick="deleteRef('${r.id}','${esc(r.title)}')">삭제</button>
        </div>
      </div>
    `).join('') + '</div>';
    // 데이터 저장 (편집용)
    window._refData = {};
    list.forEach(r => window._refData[r.id] = r);
  } catch (e) {
    container.innerHTML = '<div class="ref-empty">오류: ' + esc(e.message) + '</div>';
  }
}

function esc(s) { const d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }

// 편집 모달
function openEdit(id) {
  const r = window._refData?.[id];
  if (!r) return;
  document.getElementById('edit-id').value = id;
  document.getElementById('edit-f-title').value = r.title || '';
  document.getElementById('edit-f-category').value = r.category || '';
  document.getElementById('edit-f-source').value = r.source_filename || '';
  document.getElementById('edit-f-keywords').value = (r.keywords || []).join(', ');
  document.getElementById('edit-f-content').value = r.content || '';
  document.getElementById('edit-ov').classList.add('on');
}
function closeEdit() {
  document.getElementById('edit-ov').classList.remove('on');
}
async function saveEdit() {
  const id = document.getElementById('edit-id').value;
  const body = {
    title: document.getElementById('edit-f-title').value.trim(),
    category: document.getElementById('edit-f-category').value.trim(),
    source_filename: document.getElementById('edit-f-source').value.trim(),
    keywords: document.getElementById('edit-f-keywords').value.split(',').map(k=>k.trim()).filter(Boolean),
    content: document.getElementById('edit-f-content').value,
  };
  try {
    const res = await fetch('/api/references/' + id, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json', 'x-admin-password': adminPassword },
      body: JSON.stringify(body),
    });
    if (res.ok) { closeEdit(); loadReferences(); }
    else { alert('수정 실패: ' + (await res.json()).error); }
  } catch (e) { alert('네트워크 오류: ' + e.message); }
}

// 삭제
async function deleteRef(id, title) {
  if (!confirm('"' + title + '" 자료를 삭제하시겠습니까?')) return;
  try {
    const res = await fetch('/api/references/' + id, {
      method: 'DELETE',
      headers: { 'x-admin-password': adminPassword },
    });
    if (res.ok) loadReferences();
    else alert('삭제 실패: ' + (await res.json()).error);
  } catch (e) { alert('네트워크 오류: ' + e.message); }
}
</script>
